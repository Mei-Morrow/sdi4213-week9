name: Security Checks

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  security-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Verify .env is not tracked
        shell: bash
        run: |
          if git ls-files --error-unmatch .env > /dev/null 2>&1; then
            echo "FAIL: .env is tracked by Git."
            exit 1
          fi
          echo "PASS: .env is not tracked by Git."

      - name: Build hardened Docker image
        run: docker build -t helpdesk:security .

      - name: Verify container runs as non-root
        shell: bash
        run: |
          USER_ID=$(docker run --rm --entrypoint id helpdesk:security -u)
          echo "Container UID: $USER_ID"
          test "$USER_ID" -ne 0